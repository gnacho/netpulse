version: 2

# Releases de NetPulse: dos binarios estáticos por tag v*
#   netpulse            app completa (backend Go + frontend embebido)
#   netpulse-collector  sidecar de latencia TCP con series temporales propias
#
# OJO: los hooks globales `before:` son feature GoReleaser PRO (en OSS se
# "ejecutan" en el log pero no hacen nada, y encima rompen el embed).
# El frontend DEBE construirse ANTES de goreleaser: lo hace el paso
# "Build frontend + copia dist al embed" de .github/workflows/release.yml
# (en local: npm run build --prefix app && cp -r app/dist server-go/internal/staticspa/dist).

builds:
  - id: netpulse
    dir: server-go
    main: ./cmd/netpulse
    binary: netpulse
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: [7]
    flags: [-trimpath]
    ldflags: [-s, -w]

  - id: netpulse-collector
    dir: collector
    main: .
    binary: netpulse-collector
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: [7]
    flags: [-trimpath]
    ldflags: [-s, -w]

archives:
  - id: netpulse
    ids: [netpulse]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - src: server-go/.env.example
        dst: .env.example

  - id: netpulse-collector
    ids: [netpulse-collector]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
