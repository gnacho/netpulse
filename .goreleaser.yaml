version: 2

# Releases de NetPulse: tres binarios estáticos por tag v*
#   netpulse            app completa (backend Go + frontend embebido)
#   netpulse-collector  sidecar de latencia TCP con series temporales propias
#   netpulse-agent      agente nativo OpenWrt (push al servidor; Fase 6)
#
# OJO: los hooks globales `before:` son feature GoReleaser PRO (en OSS se
# "ejecutan" en el log pero no hacen nada, y encima rompen el embed).
# El frontend DEBE construirse ANTES de goreleaser: lo hace el paso
# "Build frontend + copia dist al embed" de .github/workflows/release.yml
# (en local: npm run build --prefix app && cp -r app/dist server-go/internal/staticspa/dist).

builds:
  - id: netpulse
    dir: server-go
    main: ./cmd/netpulse
    binary: netpulse
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: [7]
    flags: [-trimpath]
    ldflags: [-s, -w]

  - id: netpulse-collector
    dir: collector
    main: .
    binary: netpulse-collector
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: [7]
    flags: [-trimpath]
    ldflags: [-s, -w]

  # Agente nativo OpenWrt (Fase 6): binario stateless que empuja al servidor.
  # arm64 = GL-MT6000 + APs (Cortex-A53); armv7 por si aparece un AP más
  # viejo; amd64 para pilotos locales.
  - id: netpulse-agent
    dir: agent
    main: ./cmd/netpulse-agent
    binary: netpulse-agent
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: [7]
    flags: [-trimpath]
    # -X main.Version: sin esto el agente reporta "0.1.0" para siempre
    # (main.go declara var Version con fallback para builds locales).
    ldflags:
      - -s
      - -w
      - "-X main.Version={{.Version}}"

archives:
  - id: netpulse
    ids: [netpulse]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - src: server-go/.env.example
        dst: .env.example

  - id: netpulse-collector
    ids: [netpulse-collector]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE

  - id: netpulse-agent
    ids: [netpulse-agent]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - src: agent/deploy/netpulse-agent.init
        dst: netpulse-agent.init

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
